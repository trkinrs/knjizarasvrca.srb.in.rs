  naziv_udzbenika: Likovnica 2 - Mladenović
  mpc: 940.0
  title: LIKOVNA KULTURA ZA 2. RAZRED - LIKOVNICA
  description: 'Likovnica 2 : dodatno nastavno sredstvo za likovnu kulturu u drugom razredu osnovne škole. Slavica Mladenović Ivanović ilustracije Milica Mastelica, Tiberiju Beka Likovnica je pisana prema Programu nastave i učenja propisanim od strane Minstarstva prosvete, nauke i tehnološkog razvoja Republike Srbije i pozitivno odgovara na postavljene ishode. U udžbeniku se nalazi 4 oblasti/teme: Oblici, Sporazumevanje, Likovne igre i Prostor. Kroz Likovnicu učenici se, razvijajući stvaralačko mišljenje i estetičke kriterijume kroz praktičan rad, osposobljavaju za komunikaciju i izgrađuju pozitivan odnos prema kulturi i umetničkom nasleđu svog i drugih naroda.'
