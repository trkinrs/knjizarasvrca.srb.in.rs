  title: SVET OKO NAS ZA 2. RAZRED, UDŽBENIK
  description: Kao i u prvom razredu, likovi dva dečaka i dve devojčice vode učenike kroz gradivo. Postavljajući pitanja, oni ih motivišu da tragaju za odgovorima na konkretna pitanja. Poistovećujući se sa likovima, učenici mogu lako da razumeju i opišu sliku/tekst, dođu do zaključaka i budu podstaknuti na učenje novih sadržaja. Svaka lekcija podeljena je na nekoliko logičkih celina – osnovni tekst i primere, pitanja, ilustracije, slike, strip likove i zadatke – Grupni rad i Rad u paru. U njima se, na adekvatan način, pored zadataka i aktivnosti, ostavlja prostor za malo šira znanja i informacije koje se odnose na nastavnu temu.
