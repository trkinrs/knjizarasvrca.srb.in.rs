  title: SRPSKI JEZIK ZA 2. RAZRED, LATINICA
  description: Raznovrsni, metodički kvalitetno oblikovani zadaci omogućavaju ostvarivanje ishoda i razvoj kompetencija potrebnih za usvajanje čitanja i pisanja latinice. Pri obradi pisanih slova, poseban akcenat je stavljen na pravilno povezivanje slova. Kroz ceo udžbenik zastupljene su jezičke i grafičke igre (zagonetke, brzalice, rebusi, pletenice, ukrštenice). Udžbenik sistematično i kontinuirano podržava učenike u ovladavanju razumevanja pročitanog na različitim nivoima složenosti, a ne samo na najosnovnijem – da dešifruju šta piše i da reprodukuju eksplicitno navedene segmente teksta. Ovakav pristup vodi učenike ka ovladavanju različitim strategijama čitanja i otvara mogućnost da čitanje koriste kao instrument za lični razvoj i obrazovanje. Na kraju udžbenika se nalaze nalepnice sa preciznim uputstvima za pravilno pisanje svakog slova. Učenici ih mogu zalepiti u svesku kako bi im uputstva za pisanje uvek bila pri ruci. Didaktičku vrednost svake lekcije u obradi štampanih slova daju zadaci naprednog nivoa namenjeni učenicima koji već vladaju veštinama čitanja i pisanja.
