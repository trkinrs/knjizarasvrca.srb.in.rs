  title: DIGITALNI SVET ZA 2. RAZRED, UDŽBENIK
  description: 'Sa istim autorskim timom IK Vulkan znanje za školsku 2021/22. pripremila je udžbenik za Digitalni svet za drugi razred osnovne škole. Sadržaji udžbenika podeljeni su u tri oblasti: Digitalno društvo, Bezbedno korišćenje digitalnih uređaja i Algoritamski način razmišljanja. Prilagođeni su predznanju i razvojnom nivou učenika, ali su sa druge strane i dovoljno izazovni i nalaze se u zoni narednog razvoja. Autori su kroz različite zadatke i vežbe pružili mogućnost učenicima da na kreativan i zanimljiv način prošire svoje znanje o predmetu i da se upoznaju sa osnovama programiranja koje se obrađuje u predmetu Digitalni svet. Pored štampanog udžbenika u pripremi je i digitalni udžbenik Digitalni svet za drugi razred osnovne škole. Za učitelje su u izradi i godišnji i operativni plan kao i dnevne pripreme koje prate fond od 36 časova.'
