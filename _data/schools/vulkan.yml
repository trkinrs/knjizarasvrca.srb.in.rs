  title: SRPSKI JEZIK ZA 2. RAZRED, GRAMATIKA
  description: 'Jedinstveno izdanje na našem tržištu, udžbenik radnog karaktera sa tri kategorije tekstova od kojih se polazi u analizi jezičkih pojava: razgovorne situacije bliske iskustvu deteta, književni tekstovi propisani planom i programom i metodički pažljivo osmišljeni tekstovi i pesme koje su autorke same osmislile! Funkcionalnost znanje ostvarena kroz metodičku aparaturu pod nazivom: Zašto je važno da znaš osmišljen da učiteljima pomogne da pokažu učenicima da je znanje iz gramatike, pravopisa i jezičke kulture i te kako potrebno u svakodnevnom životu. Zanimljive i grafički jedinstvene sistematizacije znanja posebno osmišljene tako da uvaže interesovanja učenika i da pomognu da se gradivo lakše usvoji te da znanje bude trajnije jer se upečatljive slike dugo pamte.'
