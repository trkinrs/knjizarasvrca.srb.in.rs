  title: MUZIČKA KULTURA ZA 2. RAZRED - UDŽBENIK + CD
  description: Udžbenik za muzičku kulturu za drugi razred osnovne škole u potpunosti je usklađen s novim Planom nastave i učenja. Lekcije su usmerene na ostvarivanje ishoda. Koncipirane su tako da se obezbedi prožimanje i sadejstvo svih nastavnih oblasti. Muzički pojmovi se sistemski i postupno uvode i jedan na drugi nadovezuju. Lekcije su u korelaciji sa svakodnevnim životom, okruženjem i pojavama radi lakšeg usvajanja novog gradiva. Prednost je data iskustvenom učenju u okviru kojeg učenici razvijaju perceptivne i kognitivne sposobnosti. Smernice i nalozi u udžbeniku su u funkciji slušne i reproduktivne komponente muzikalnosti, bogatog emocionalnog doživljaja muzike, razvoja estetskog osećaja za muzičku formu i muzičko stvaralaštvo. Po prvi put u udžbeniku muzičke kulture učenik se upoznaje sa jedinstvenim sistemom obeležavanja zvučnih osobina, koji na vrlo jednostavan, praktičan i posredan način uvodi učenike u budući proces muzičkog opismenjavanja. Ova metodička inovacija je sistemski uvedena i doprinosi razvoju muzičkog mišljenja i osećaja za muzički prostor. Udžbenik prati i CD s mnoštvom slušnih primera i velikim brojem muzičkih matrica.
