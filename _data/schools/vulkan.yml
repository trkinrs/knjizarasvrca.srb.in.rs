'388658':
  predmet: Likovna kultura 650-02-00242/2023-07 od 21.12.2023. i 1058-3/2019 od 5.6.2019.
  naziv_udzbenika: Udžbenik 2 - Stojanović
  mpc: 940.0
  title: LIKOVNA KULTURA ZA 2. RAZRED, UDŽBENIK
  description: 'Udžbenik za Likovnu kulturu za drugi razred osnovne škole. U koncipiranju udžbenika podjednak značaj dat je usvajanju likovnih pojmova propisanih Programom nastave i učenja za drugi razred osnovne škole, kao i praktičnom rešavanju likovnih zadataka. Gradivo je raspoređeno u četiri tematske celine, a svaku prate istraživački zadaci za grupni likovni rad. Lekcije su osmišljene tako da učenici polaze od ličnog iskustva i stvarnosti koja ih okružuje, te samostalno uočavaju određene likovne termine i pojmove, a kroz raznovrsne kreativne zadatke upotpunjuju svoje znanje. Rukopis obiluje reprodukcijama vrhunskih umetničkih dela, kao i samostalnim radovima učenika. Praktični deo sa likovnim zadacima podstiče kreativni likovni izraz, razvija kompetencije za snalaženje i aktivno učešće u savremenom društvu, budi stvaralačke sposobnosti i kritičko mišljenje. Grafički oblikovana metodička aparatura doprinosi preglednosti izloženog gradiva. Digitalni udžbenik: 3D animacije za razumevanje likovnih pojmova i doživljaj slikarske epohe, video-zapisi za prikaz likovnih tehnika, interaktivni testovi za proveru znanja, galerije slika za likovni podsticaj.'
  autor: Milena Stojanović Stošić, Dušan Stošić
  izdavac: VULKAN ZNANJE
