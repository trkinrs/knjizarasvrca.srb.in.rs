  title: SRPSKI JEZIK ZA 2. RAZRED, RADNA SVESKA
  description: 'Radna sveska u potpunosti prati Gramatiku i Čitanku. Udžbenik obiluje novim zadacima koji se ne pojavljuju ni u jednom delu kompleta, različitim tipovima zadataka, ukrštenicama, asocijacijama koji doprinose funkcionalnom povezivanju znanja. Prvi put na našem tržištu u nižim razredima radna sveska ima posebno osmišljenu metodičku aparaturu: Smejalica – zabavni, relaksirajući segmenti koji su povezani sa nastavom jezika, osmišljeni tako da učenik lakše zapamti određeni sadržaj Istraživalica – istraživački zadaci za proširivanje znanja, pomoću enciklopedija, pretraživanjem interneta, knjiga, u interakciji sa drugim učenicima. Seckalica – doprinosi razvoju fine motorike i kreativnosti kod učenika, koji će napraviti plakat za učionicu, poster za svoju sobu, proširiće znanja o zdravoj ishrani, osmisliće i napraviti memorijske kartice i slično.'
