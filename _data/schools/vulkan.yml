  title: KOMPLET - ENGLESKI JEZIK ZA 2. RAZRED, THE STORY GARDEN 2 NIZ
  description: The Story Garden 2, svojim jedinstvenim Heart and Mind pristupom podstiče maštu i kreativnost. Obilje raznovrsnih zadataka pruža mogućnost da svaki učenik napreduje u skladu sa svojim sposobnostima a nastavniku da svaki čas bude dinamičan i zanimljiv. Više nego dovoljno materijala za rad na času - nastavnik ne mora da se snalazi tražeći dodatne materijale. Gradirani zadaci - od lakših ka težim. Zadaci za učenike sa naprednijim znanjem (Learn More). Jedinstven koncept - bajke su podloga za prikazivanje jezičke građe a priče imaju neočekivane i zanimljive obrte. Mr Green Puppet olakšava rad nastavniku a časove čini zanimljivijim. Audio i video zapise pevaju / govore izvorni govornici. Aranžmani pesama su moderni i praćeni karaoke verzijom. Lepe ilustracije u kombinaciji sa fotografijama iz stvarnog života. Odličan balans zadataka za uvežbavanje motorike. Lapbook– Learning by doing - autentičan dodatak koji pruža mogućnost praktične primene naučenog. Zadaci razvijaju kreativnost i kognitivnu sposobnost učenika. Bogat nastavnički paket.
