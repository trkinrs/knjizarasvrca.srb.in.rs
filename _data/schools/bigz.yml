  title: Srpski jezik 7, radna sveska
  description: 'Srpski jezik 7, radna sveska Autori: Jasmina Stanković, Svetlana Stevanović, Jole Bulatović , Zorana Bošković, Milan Šipovac Radna sveska sadrži mnoštvo raznovrsnih zadataka osnovnog, srednjeg i naprednog nivoa, koji su usklađeni sa obrazovnim standardima i ishodima. Zadaci su rađeni prema modelu zadataka sa završnog ispita i PISA testiranja. Posebnu vrednost predstavljaju zadaci za uvežbavanje veštine čitanja i razumevanja pročitanog. Na kraju radne sveske se nalazi Dnevnik čitanja lektire, koji sadrži pripremljene obrasce i istraživačke zadatke za beleške učenika tokom čitanja lektire.'
