  mpc: 1320.0
  title: Geografija 7 udžbenik
  description: 'Geografija 7 Autori: Igor Leščešen, Slobodan Zrnić, Biljana Kolaček, Aleksandra Jovičić Udžbenik – Gradivo je podeljeno u osam poglavlja u okviru kojih je obrađena regionalna geografija Evrope i vanevropskog sveta, u skladu sa izmenjenim programom nastave i učenja za sedmi razred. Autori su se potrudili da na jasan, praktičan i zanimljiv način upoznaju učenike sa osnovnim fizičko-geografskim i društveno-geografskim elementima svih kontinenata. Pored osnovnog teksta, koji je jezički i sadržinski prilagođen uzrastu učenika, i brojnih zanimljivosti, udžbenik sadrži fotografije, geografske karte, tabele, grafikone i pojmovne mape.'
