7SRG2:
  naziv_udzbenika: Gramatika 7 - Stevanović
  mpc: 1160.0
  title: Gramatika 7
  description: 'Gramatika 7 - „S reči na dela” Autori: Slobodan Novokmet, Vesna Đorđević, Jasmina Stanković, Svetlana Stevanović, Jole Bulatović Gramatika je funkcionalno, grafički i sadržajno povezana sa čitankom.Lekcije u gramatici su zasnovane na najsavremenijim vaspitno-pedagoškim metodama. Zastupljeni su brižljivo odabrani primeri prilagođeni učenicima ovog uzrasta. Pažljivo odabranom aparaturom nastavniku se sugerišu odgovarajući metodički postupci prilikom izvođenja nastave, a učenicima se olakšava usvajanje znanja iz oblasti jezika i jezičke kulture. Na kraju svakog poglavlja nalazi se test kojim se utvrđuje i sistematizuje znanje. Lekcije iz jezičke kulture obrađene su inovativno i temeljno. Učenicima se pruža pomoć u čitanju nelinearnih tipova tekstova, osnažuje se njihova kritička svest i sposobnost argumentovanog izlaganja. Ilustracije su osmišljene tako da imaju narativnu strukturu. Stavljanjem književnih junaka u ulogu vodiča kroz udžbenik ostvareno je nešto na čemu se izuzetno insistira u nastavnim programima za osnovnu školu – povezanost gradiva iz književnosti i jezika.'
  autor: Slobodan Novokmet, Vesna Đorđević, Jasmina Stanković, Svetlana Stevanović, Jole Bulatović Gramatika je funkcionalno, grafički i sadržajno povezana sa čitankom
  izdavac: BIGZ školstvo
  isbn: ''
