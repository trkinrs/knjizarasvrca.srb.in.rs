  title: Biologija 7 udžbenik
  description: 'Biologija 7 Autori: Dejan Bošković Udžbenik – na početku svake lekcije nalaze se pitanja za proveru naučenog gradiva iz 5. i 6. razreda. Uvodi u lekciju su dati kao zanimljivosti i slike koje će učenike motivisati i uvesti u novo gradivo. Mnoštvo pitanja za promišljanje i zadataka za praktičan rad omogućavaju ostvarivanje definisanih ishoda. Na kraju svake lekcije nalaze se pitanja i istraživački zadaci poređani po težini. Testovi za proveru znanja na kraju svake oblasti pomažu učenicima da procene i samovrednuju svoje znanje.'
