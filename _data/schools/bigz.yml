7SRC2:
  naziv_udzbenika: Čitanka 7 - Bošković
  mpc: 1320.0
  title: Čitanka 7
  description: 'Čitanka 7 Autori: Zorana Bošković, Milan Šipovac Čitanka je istovremeno inovativna, u pristupu organizacije i izvođenja nastave, i tradicionalna, u smislu izbora tekstova i poštovanja metodičke prakse. Udžbenik je podeljen u devet celina osmišljenih tako da tokom školske godine nastavnik izvodi nastavu krećući se od prve do poslednje strane. U rasporedu obrade književnih dela vođeno je računa o tematskoj povezanosti, postepenom usvajanju književnoteorijskih znanja, obradi lekcija iz oblasti gramatike, o takmičenju iz književnosti, kao i o drugim predmetima sa kojima se može uspostaviti korelacija. Metodička aparatura pruža sigurnost nastavniku i učenicima, vodeći ih kroz čitanje i tumačenje dela iz obaveznog i izbornog programa, od pripremnih faza, preko osnovnog i zahtevnijeg interpretiranja, do uspostavljanja unutarpredmetnih i međupredmetnih korelacija. Na kraju svakog poglavlja nalazi se test kojim se utvrđuje i sistematizuje znanje.'
  autor: Zorana Bošković, Milan Šipovac Čitanka je istovremeno inovativna, u pristupu organizacije i izvođenja nastave, i tradicionalna, u smislu izbora tekstova i poštovanja metodičke prakse
  izdavac: BIGZ školstvo
  isbn: ''
